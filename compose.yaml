# Local Postgres for development. Same major version as Neon (17).
# Host port 5433, so it doesn't clash with a Postgres installed on the machine (5432).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oms
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oms"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  db-data:
