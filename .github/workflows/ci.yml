name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oms"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/oms
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain src/db/migrations)" || (echo "Run pnpm db:generate and commit the migration" && exit 1)
      - run: pnpm db:migrate
      - run: pnpm build
